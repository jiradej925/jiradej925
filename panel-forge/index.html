<title>Panel Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Chakra+Petch:wght@500;600;700&family=Comic+Neue:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Mali:wght@400;600&family=Patrick+Hand&family=Special+Elite&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#131216;--bg2:#19181d;--panel:#211f26;--line:#2d2b33;--line2:#3e3a45;
  --text:#eeeae2;--muted:#a59f95;--faint:#716b75;
  --gold:#d8a540;--gold-hi:#e9bd5e;--gold-ink:#1c1405;--gold-soft:rgba(216,165,64,.13);
  --ok:#78c291;--warn:#e7ad62;--bad:#e27462;
  --desk:#0e0d10;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Chakra Petch","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 17px/1 var(--disp);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.mark{width:24px;height:24px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px}
.mark i{background:var(--gold);border-radius:1px}.mark i:first-child{grid-column:1/-1}
.proj{display:flex;gap:8px;align-items:center;flex:1 1 320px;min-width:0}
.proj input{max-width:240px}
.proj select{max-width:170px}
.modes{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.modes button{border:0;background:none;padding:8px 14px;cursor:pointer;font:600 13px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.modes button span{font:400 12px var(--ui);letter-spacing:0;opacity:.8}
.modes button.on{background:var(--gold);color:var(--gold-ink)}
.savebox{display:flex;align-items:center;gap:10px;margin-left:auto}
.savestate{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.savestate.bad{color:var(--warn)}

/* main columns */
main{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr) minmax(270px,330px);min-height:0}
.col{overflow:auto;min-height:0;position:relative}
.left{border-right:1px solid var(--line);padding:18px 18px 28px}
.center{background:var(--desk);background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:18px 18px;padding:18px 16px 40px}
.right{border-left:1px solid var(--line);padding:18px 16px 28px;background:var(--bg)}

/* step bar */
.steps{display:flex;gap:4px;overflow-x:auto;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:1px solid var(--line)}
.step{flex:1 0 auto;display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 12px;border-radius:9px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;font:600 13px var(--disp);letter-spacing:.04em;white-space:nowrap}
.step:hover{background:var(--panel);color:var(--text)}
.step .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font:500 12px var(--mono)}
.step.done .n{border-color:var(--gold);color:var(--gold)}
.step.on{background:var(--gold-soft);border-color:rgba(216,165,64,.55);color:var(--text)}
.step.on .n{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}

/* type */
.eyebrow{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
h2{margin:2px 0 0;font:600 21px/1.2 var(--disp);letter-spacing:.02em;text-wrap:balance}
h3{margin:0;font:600 12px var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.lead{color:var(--muted);margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* building blocks */
.stack{display:grid;gap:10px}
.sec{display:grid;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.sec.first{border-top:0;padding-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1 1 auto}
.btn{min-height:40px;padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;color:var(--text)}
.btn:hover:not(:disabled){border-color:var(--faint)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover:not(:disabled){background:var(--gold-hi)}
.btn.big{min-height:50px;width:100%;font-size:15px}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px;border-radius:7px}
.btn.ghost{background:none}
.btn.danger{color:#f1a597}
.btn.icon{width:40px;padding:0;font-size:20px;line-height:1}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.wait{position:relative;color:transparent!important}
.btn.wait::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid var(--gold-ink);border-right-color:transparent;animation:spin .8s linear infinite}
.btn:not(.gold).wait::after{border-color:var(--gold);border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.f{display:grid;gap:5px}
.f>span{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.f>small{color:var(--faint);font-size:12px}
input[type=text],input:not([type]),textarea,select{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;color:var(--text)}
textarea{resize:vertical;min-height:62px;line-height:1.45}
input[type=color]{width:40px;height:40px;padding:3px;border:1px solid var(--line2);border-radius:8px;background:var(--bg2);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=checkbox]{accent-color:var(--gold);width:18px;height:18px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:2px;flex:none}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:8px 6px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--gold-soft);color:var(--gold-hi)}
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:20px 14px;text-align:center;color:var(--muted);cursor:pointer;display:grid;gap:4px;place-items:center;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-soft)}
.drop b{color:var(--text);font-weight:600}
.drop.slim{padding:12px}
.note{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}
.note b{color:var(--text)}
.note.warn{border-color:rgba(231,173,98,.4);color:#efc792}
.note.gold{border-color:rgba(216,165,64,.4)}
.note.bad{border-color:rgba(226,116,98,.45);color:#f0a99c}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;background:var(--bg2);cursor:pointer;font-weight:600;font-size:13px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.on{border-color:var(--gold);background:var(--gold-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.tag.gold{color:var(--gold);border-color:rgba(216,165,64,.4)}
.tag.warn{color:var(--warn);border-color:rgba(231,173,98,.4)}
.img-box{border-radius:10px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);position:relative}
.img-box img{display:block;width:100%;height:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepnav{display:flex;gap:8px;margin-top:18px}
.stepnav .btn{flex:1}

.dropwrap{display:grid;gap:6px}
.folderbtn{justify-self:center;color:var(--muted);border-color:transparent}
.choose-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;max-height:min(56vh,520px);overflow:auto;padding:2px}
.ch{display:grid;gap:4px;padding:5px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);cursor:pointer;text-align:left;color:var(--text)}
.ch .im{aspect-ratio:1;border-radius:6px;background:var(--panel);display:grid;place-items:center;overflow:hidden}
.ch .im img{width:100%;height:100%;object-fit:cover}
.ch .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.ch:hover{border-color:var(--faint)}.ch.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.ch.bad{opacity:.4}
dialog{background:var(--bg2);color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:0;width:min(640px,calc(100% - 32px));max-height:calc(100% - 32px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(8,7,10,.7)}
.dlg{padding:20px;display:grid;gap:14px}
.pose-card.bg-card img{aspect-ratio:4/3;object-fit:cover;background:var(--panel)}
.prow{display:flex;gap:8px;align-items:center}.prow select{flex:1}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.who{border:1px solid var(--line2);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--bg2)}
.who-head{display:flex;gap:8px;align-items:center}.who-head canvas{margin-left:auto;width:40px;height:60px;border-radius:6px}
#panelPrev{width:100%;height:auto;border-radius:10px;display:block;background:#000}
.editor-tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
/* pose */
.pose-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pose-card{border:1px solid var(--line2);border-radius:10px;padding:6px;background:var(--bg2);cursor:pointer;display:grid;gap:5px;text-align:left}
.pose-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pose-card canvas,.pose-card img{width:100%;aspect-ratio:2/3;object-fit:contain;background:#000;border-radius:6px;display:block}
.pose-card .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#poseEd{width:100%;max-width:300px;aspect-ratio:2/3;border-radius:10px;display:block;margin:0 auto;touch-action:none;cursor:grab;background:#000}
.presets{display:flex;flex-wrap:wrap;gap:6px}

/* characters */
.char{border:1px solid var(--line2);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--bg2)}
.char-head{display:flex;gap:8px;align-items:center}
.char-head input[type=text]{font:600 15px var(--disp);letter-spacing:.06em}
.slot{border:1px dashed var(--line2);border-radius:8px;aspect-ratio:3/4;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--faint);cursor:pointer;overflow:hidden;position:relative;background:var(--bg)}
.slot:hover{border-color:var(--gold)}
.slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.slot .x{position:absolute;top:3px;right:3px;z-index:2;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.slot .lb{position:absolute;left:0;right:0;bottom:0;z-index:1;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;padding:10px 4px 3px;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.06em}

/* layout thumbs */
.lay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.lay{border:1px solid var(--line2);border-radius:10px;background:var(--bg2);padding:8px;cursor:pointer;display:grid;gap:6px;justify-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.lay svg{width:100%;max-width:70px;height:auto}
.lay.on{border-color:var(--gold);color:var(--text);box-shadow:0 0 0 1px var(--gold)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches input[type=color]{width:38px;height:38px}

/* canvas */
.canvas-head{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:680px;margin:0 auto 12px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.canvas-head b{color:var(--text);font-family:var(--disp);letter-spacing:.04em}
.page{margin:0 auto;background:#fff;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
.page svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.page .pnl{cursor:pointer}
.page .bub{cursor:move}
.page [data-h]{cursor:crosshair}

/* inspector */
.insp-head{display:flex;align-items:center;gap:10px}
.insp-head>div{flex:1;text-align:center}
.thumb{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg2);aspect-ratio:var(--ar,1);display:grid;place-items:center;color:var(--faint);font-size:12px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.var{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--bg2);display:grid}
.var.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.var img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.var .row{padding:6px;justify-content:space-between}
.hist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.hist button{flex:none;width:58px;height:58px;border-radius:8px;overflow:hidden;border:1px solid var(--line2);padding:0;cursor:pointer;background:var(--bg2);position:relative}
.hist button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.hist img{width:100%;height:100%;object-fit:cover}
.hist span{position:absolute;left:3px;top:2px;font:500 10px var(--mono);color:#fff;text-shadow:0 1px 2px #000}

/* prompt + chat */
.prompt{font:12.5px/1.55 var(--mono);background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:12px;white-space:pre-wrap;max-height:300px;overflow:auto;color:#d9d3c8}
.attach{display:grid;gap:6px}
.att{display:flex;gap:10px;align-items:center;font-size:13px}
.att .t{width:38px;height:38px;border-radius:6px;overflow:hidden;background:#000;flex:none;display:grid;place-items:center;color:var(--faint);font-size:10px;border:1px solid var(--line)}
.att .t img,.att .t canvas{width:100%;height:100%;object-fit:cover}
.chat{display:grid;gap:8px}
.msg{padding:10px 12px;border-radius:10px;font-size:13.5px;white-space:pre-wrap}
.msg.me{background:var(--panel);justify-self:end;max-width:88%}
.msg.ai{background:var(--bg2);border:1px solid rgba(216,165,64,.35)}
.msg.ai .row{margin-top:8px}
.bub-list{display:grid;gap:6px}
.bub-item{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--bg2);cursor:pointer;text-align:left;width:100%}
.bub-item.on{border-color:var(--gold)}
.bub-item .o{width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font:600 11px var(--mono);flex:none}
.bub-item .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veo{border:1px solid var(--line2);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--bg2)}
.veo textarea{font:12.5px/1.5 var(--mono)}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#2a2730;border:1px solid var(--line2);color:var(--text);padding:10px 16px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:50;max-width:min(520px,calc(100% - 32px));font-size:13.5px}
.toast[hidden]{display:none}

@media (max-width:1180px){
  #app{height:auto;min-height:100%}
  main{grid-template-columns:minmax(300px,360px) minmax(0,1fr)}
  .col{overflow:visible}
  .right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  .steps{position:sticky;bottom:0;z-index:20}
}
@media (max-width:760px){
  main{grid-template-columns:minmax(0,1fr)}
  .left{border-right:0}
  .step{padding:8px 10px}
  .step .lbl{display:none}
  .step.on .lbl{display:inline}
  .proj input{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>

<div id="app">
  <header class="top" id="top"></header>
  <main>
    <section class="col left" id="left" aria-label="Step tools"></section>
    <section class="col center" id="center" aria-label="Page canvas"></section>
    <aside class="col right" id="right" aria-label="Panel inspector"></aside>
  </main>
  <nav class="steps" id="steps" aria-label="Workflow steps"></nav>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<dialog id="chooser" aria-labelledby="chTitle"><div class="dlg"><div><div class="eyebrow">Choose from folder</div><h2 id="chTitle">Pick a picture</h2><p class="lead" id="chSub"></p></div><div class="choose-grid" id="chGrid"></div><div class="row"><button class="btn gold grow" data-act="chooserOk" id="chOk" disabled>Use selected</button><button class="btn ghost" data-act="chooserClose">Cancel</button></div></div></dialog>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const f1=n=>Math.round(n*10)/10;
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const trunc=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4200)}

/* ---------- constants ---------- */
const STEPS=[
  ['Add background','Add pictures of the places where your story happens, from any picture file on your computer. Then choose which panels use each background. Claude redraws it in manga or manhwa style.'],
  ['Characters','Lock in who appears, so they look the same in every panel.'],
  ['Pose','Choose how the character stands or moves: upload a pose file, build a stick figure, or use a photo of yourself.'],
  ['Layout','Pick a page or strip layout, set the look, and plan what happens in each panel.'],
  ['Generate','Get the art for each panel. Copy the prompt into Gemini, then bring the pictures back here and pick the best one.'],
  ['Refine','Describe a change ("make her look angrier") and Claude writes the edit for Gemini. Every version is kept.'],
  ['Letter','Add speech bubbles, thoughts, captions and sound effects. They stay editable and never get baked into the art.'],
  ['Export','Download panels, the full page or strip, and your project file.'],
  ['Animate','Get a ready-to-paste Veo video prompt and a 2.5D layer plan for every panel.'],
];
const SHOTS={ecu:'Extreme close-up',cu:'Close-up',med:'Medium shot',full:'Full body',wide:'Wide shot',bird:"Bird's-eye view",worm:"Worm's-eye view",dutch:'Dutch angle'};
const POSE_KINDS={openpose:'OpenPose skeleton',depth:'Depth map',silhouette:'Silhouette',lineart:'Line art',clean:'Clean picture'};
const SPACES={top:'Top',right:'Right side',left:'Left side',bottom:'Bottom',none:'No space needed'};
const MANGA={
  splash:{label:'Splash',r:[[0,0,1,1]]},
  '3':{label:'3 panels',r:[[0,0,1,.40],[.51,.42,.49,.58],[0,.42,.49,.58]]},
  '4':{label:'4 panels',r:[[0,0,1,.30],[.51,.32,.49,.34],[0,.32,.49,.34],[0,.68,1,.32]]},
  '5':{label:'5 panels',r:[[.51,0,.49,.30],[0,0,.49,.30],[0,.32,1,.30],[.40,.64,.60,.36],[0,.64,.38,.36]]},
  '6':{label:'6 panels',r:[[.51,0,.49,.32],[0,0,.49,.32],[.51,.34,.49,.32],[0,.34,.49,.32],[.51,.68,.49,.32],[0,.68,.49,.32]]},
};
const MANHWA={
  opening:{label:'Opening',sizes:['wide','standard','standard','tall']},

/* ---------- field binding ---------- */
function resolvePath(path){
  const parts=path.split('.'),head=parts.shift();let obj,lib=false;
  if(head==='p')obj=P;else if(head==='pn')obj=selPanel();else if(head==='bb')obj=selBubble();
  else if(head.startsWith('ch:')){obj=charById(head.slice(3));lib=true}
  else if(head.startsWith('pose:'))obj=poseById(head.slice(5));
  else if(head.startsWith('bg:'))obj=bgById(head.slice(3));
  else if(head.startsWith('veo:')){const pn=P.panels.find(x=>x.id===head.slice(4));if(pn)obj=pn.veo||(pn.veo={})}
  for(let i=0;i<parts.length-1;i++)obj=obj&&obj[parts[i]];
  return[obj,parts[parts.length-1],lib];
}
function onField(el){
  const [obj,key,lib]=resolvePath(el.dataset.f);if(!obj)return;
  let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.t==='num')v=+v;
  obj[key]=v;markDirty(lib);
  const r=(el.dataset.r||'').split(',');
  if(r.includes('canvas'))renderCenter();else if(r.includes('bubbles'))renderBubbles();
  if(r.includes('right'))renderRight();
  if(r.includes('bubsize')){const s=$('#bubSize');if(s)s.textContent=v}
  if(r.includes('gutter')){const s=el.closest('.f');if(s)s.querySelector('span').textContent=`Gap between panels · ${v} px`}
  if(r.includes('projname')){const o=$(`#projPick option[value="${CSS.escape(P.id)}"]`);if(o)o.textContent=trunc(v,28)}
  if(r.includes('left5')&&P.step===5)renderLeft();
  if(r.includes('left1')&&P.step===1)renderLeft();
  if(r.includes('left3')&&P.step===3)renderLeft();
  const po=$('#promptOut');if(po)po.textContent=buildPrompt(selPanel());
  if(el.dataset.f.startsWith('bb.')&&P.step===7){const it=$(`.bub-item.on .tx`);if(it&&key==='text')it.textContent=v}
}
document.addEventListener('input',e=>{const el=e.target.closest('[data-f]');if(el&&el.type!=='checkbox'&&el.type!=='file')onField(el)});

  if(!drag)return;const p=svgPt(drag.svg,e),{b,r,o}=drag,dx=p.x-drag.start.x,dy=p.y-drag.start.y;

const A={

  /* upload */

  },
  pickBg(el){P.bgSel=el.dataset.id;renderLeft()},
  async replaceBg(el,files){const b=selBg();if(!b)return;const f=(await readPictures(files,1))[0];if(!f)return;b.ref=await putImage(f);b.realPerson=false;b.permission=false;markDirty();renderAll();toast('Background replaced.')},
  delBg(el){if(!confirmClick(el,'Click again to delete'))return;const b=selBg();if(!b)return;P.backgrounds=P.backgrounds.filter(x=>x!==b);P.panels.forEach(pn=>{if(pn.bgId===b.id)pn.bgId=null});P.bgSel=P.backgrounds[0]?P.backgrounds[0].id:null;markDirty();renderAll()},
  bgPanel(el){const b=selBg();if(!b)return;const pn=P.panels[+el.dataset.i];pn.bgId=pn.bgId===b.id?null:b.id;markDirty();renderLeft();renderCenter();renderRight()},
  bgAll(el){const b=selBg();if(!b)return;const on=el.dataset.v==='all';P.panels.slice(0,panelCount(P)).forEach(pn=>{if(on)pn.bgId=b.id;else if(pn.bgId===b.id)pn.bgId=null});markDirty();renderLeft();renderCenter();renderRight()},
  async analyze(el){

    if(!SAMPLE_IMG){toast('Claude cannot look at pictures in this view.');return}
    await busy(el,async()=>{
      try{
        const blob=await blobOf(bg.ref);
        const r=await SAMPLE.json(`You are helping a comic artist use this picture as the BACKGROUND (the setting) for ${P.mode==='manga'?'manga':'manhwa'} panels. Describe the place so it can be redrawn behind the characters.
Reply with only a JSON object: {"setting": string, "time": string, "details": string, "lighting": string, "mood": string, "realPerson": boolean}
- setting: what kind of place this is. One short sentence.
- time: time of day, season and weather. Short phrase.

        (Array.isArray(r.panels)?r.panels:[]).forEach((x,k)=>{const i=(+x.panel||k+1)-1,pn=vis[i];if(!pn)return;pn.veo={prompt:String(x.veo||''),fg:String(x.foreground||''),ch:String(x.character||''),bg:String(x.background||'')}});

function pushHist(pn,ref,note){pn.history=pn.history.slice(0,pn.h+1);pn.history.push({ref,note});pn.h=pn.history.length-1}
const slug=s=>String(s||'project').toLowerCase().replace(/[^a-z0-9ก-๙]+/gi,'-').replace(/^-|-$/g,'')||'project';

async function offer(filename,data){
  if(!DL){toast('Downloads work when this page is open in Claude.');return false}
  try{await DL.save({filename,data});toast('Saved '+filename);return true}
  catch(e){toast({declined:'Download cancelled.',rate_limited:'Another download is waiting for your answer.',too_large:'That file is too big to save here.'}[e&&e.code]||'Could not save the file.');return false}
}
function veoText(){return P.panels.slice(0,panelCount(P)).map((pn,i)=>{const v=pn.veo||{};return `PANEL ${i+1} · ${SHOTS[pn.shot]}\n${pn.line||''}\n\nVEO PROMPT\n${v.prompt||'(not written yet)'}\n\nPARALLAX LAYERS\nForeground: ${v.fg||'-'}\nCharacter: ${v.ch||'-'}\nBackground: ${v.bg||'-'}\n`}).join('\n────────────────────────\n\n')}
async function projectJSON(){
  const p=clone(P),chars=clone(LIB.chars);
  const conv=async o=>{if(Array.isArray(o)){for(let i=0;i<o.length;i++)o[i]=await conv(o[i]);return o}if(o&&typeof o==='object'){for(const k of Object.keys(o))o[k]=await conv(o[k]);return o}
    if(isRef(o)){try{const b=await blobOf(o);return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}catch(e){return null}}return o};
  await conv(p);await conv(chars);
  return JSON.stringify({app:'panel-forge',version:1,saved:new Date().toISOString(),project:p,characters:chars});
}

/* ---------- drawing for export ---------- */
async function fontsReady(){try{await Promise.all(Object.values(FONTS).map(f=>document.fonts.load(`${f.w} 32px ${f.fam}`)))}catch(e){}}
async function drawPage(scale,lettering){
  const {w,h}=pageSize(P),c=document.createElement('canvas');c.width=Math.round(w*scale);c.height=Math.round(h*scale);
  const x=c.getContext('2d');x.scale(scale,scale);x.fillStyle='#fff';x.fillRect(0,0,w,h);
  const rects=layoutRects(P);
  for(let i=0;i<rects.length;i++){
    const r=rects[i],pn=P.panels[i],u=urlOf(cur(pn));
    x.save();x.beginPath();x.rect(r.x,r.y,r.w,r.h);x.clip();
    let drawn=false;
    if(u){try{const im=await loadImg(u),s=Math.max(r.w/im.naturalWidth,r.h/im.naturalHeight),dw=im.naturalWidth*s,dh=im.naturalHeight*s;x.drawImage(im,r.x+(r.w-dw)/2,r.y+(r.h-dh)/2,dw,dh);drawn=true}catch(e){}}
    if(!drawn){x.fillStyle='#eeebe5';x.fillRect(r.x,r.y,r.w,r.h);x.fillStyle='#bdb7ac';x.font='700 48px "Chakra Petch", sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(String(i+1),r.x+r.w/2,r.y+r.h/2)}
    x.restore();
    if(P.mode==='manga'){x.lineWidth=5;x.strokeStyle='#111';x.strokeRect(r.x,r.y,r.w,r.h)}
  }
  if(lettering){await fontsReady();rects.forEach((r,i)=>P.panels[i].bubbles.forEach(b=>drawBubble(x,bubGeom(b,r))))}
  return c;
}
async function panelBlob(i,lettering){
  const r=layoutRects(P)[i],scale=2,page=await drawPage(scale,lettering),c=document.createElement('canvas');
  c.width=Math.round(r.w*scale);c.height=Math.round(r.h*scale);c.getContext('2d').drawImage(page,r.x*scale,r.y*scale,r.w*scale,r.h*scale,0,0,c.width,c.height);
  return canvasBlob(c);
}
async function addSlices(z,prefix){
  const page=await drawPage(1,true),n=Math.ceil(page.height/SLICE_H);
  for(let k=0;k<n;k++){const h=Math.min(SLICE_H,page.height-k*SLICE_H),c=document.createElement('canvas');c.width=STRIP_W;c.height=h;c.getContext('2d').drawImage(page,0,k*SLICE_H,STRIP_W,h,0,0,STRIP_W,h);z.file(`${prefix}${String(k+1).padStart(2,'0')}.png`,await canvasBlob(c))}
}
async function paletteFrom(ref){
  const im=await loadImg(urlOf(ref)),c=document.createElement('canvas');c.width=48;c.height=48;const x=c.getContext('2d');x.drawImage(im,0,0,48,48);
  const d=x.getImageData(0,0,48,48).data,m=new Map();
  for(let i=0;i<d.length;i+=4){const k=(d[i]>>5)<<6|(d[i+1]>>5)<<3|(d[i+2]>>5);const e=m.get(k)||[0,0,0,0];e[0]+=d[i];e[1]+=d[i+1];e[2]+=d[i+2];e[3]++;m.set(k,e)}
  const cols=[...m.values()].sort((a,b)=>b[3]-a[3]).map(e=>[e[0]/e[3],e[1]/e[3],e[2]/e[3]]),out=[];
  for(const c1 of cols){if(out.every(o=>Math.hypot(o[0]-c1[0],o[1]-c1[1],o[2]-c1[2])>60))out.push(c1);if(out.length>=6)break}
  while(out.length<6)out.push(cols[out.length]||[128,128,128]);
  return out.map(c1=>'#'+c1.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''));
}
async function detectPoseKind(file){
  try{
    const bmp=await createImageBitmap(file),c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');x.drawImage(bmp,0,0,64,64);
    const d=x.getImageData(0,0,64,64).data,n=4096;let dark=0,light=0,sat=0,mid=0;const levels=new Set();
    for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]),l=(mx+mn)/2;
      if(mx<40)dark++;if(mn>215)light++;if(mx-mn>70&&mx>120)sat++;if(mx-mn<18){levels.add(mx>>4);if(l>=40&&l<=215)mid++}}
    const fd=dark/n,fl=light/n,fs=sat/n,fm=mid/n;
    if(fd>.5&&fs>.01&&fs<.4)return 'openpose';
    if(fs<.02&&levels.size>=7&&fm>.25)return 'depth';
    if(fs<.02&&fl>.5&&fd<.12)return 'lineart';
    if(fs<.02&&fd+fl>.85)return 'silhouette';
    return 'clean';
  }catch(e){return 'clean'}
}
